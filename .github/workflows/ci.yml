name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Run GoReleaser (Snapshot)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,docker,sign

      - name: Verify Builds
        run: |
          # Find the linux build
          CADDY_BIN=$(find dist -name caddy -type f | grep linux_amd64 | head -n 1)
          if [ -z "$CADDY_BIN" ]; then
            echo "::error::Could not find built binary"
            exit 1
          fi

          chmod +x "$CADDY_BIN"
          echo "Verifying binary: $CADDY_BIN"

          # Check version
          "$CADDY_BIN" version

          # Check modules
          MODULES=$("$CADDY_BIN" list-modules)

          REQUIRED=("dns.providers.cloudflare" "security" "caddy.storage.cloudflare_kv" "http.encoders.br" "http.handlers.rate_limit" "layer4" "http.handlers.waf")

          for mod in "${REQUIRED[@]}"; do
            if echo "$MODULES" | grep -q "$mod"; then
              echo "✅ Plugin found: $mod"
            else
              echo "::error::Missing plugin: $mod"
              exit 1
            fi
          done

  # Runs each dependency's own test suite at the pinned go.mod version.
  # Catches plugin regressions before a Renovate bump merges. Not a
  # substitute for a runtime smoke test: a package's unit tests can bypass
  # Provision() entirely by hand-building its structs.
  upstream-tests:
    runs-on: ubuntu-latest

    env:
      # A dependency's own tests pull in its test-only deps (testify etc.),
      # missing from our go.sum. -mod=mod resolves them on the fly, scoped
      # to this job only.
      GOFLAGS: -mod=mod

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Download modules
        run: go mod download

      # Go extracts modules read-only; some tests (e.g. caddy-security)
      # write temp files next to their source and fail without this.
      - name: Make module cache writable
        run: chmod -R u+w "$(go env GOMODCACHE)"

      # -short skips Caddy's slower e2e tests.
      - name: caddyserver/caddy (core)
        run: go test -short -count=1 github.com/caddyserver/caddy/v2/...

      # Behind the 2026-08 incident: whitelist_countries returned
      # "internal_error" on a live request despite a clean Provision.
      - name: fabriziosalmi/caddy-waf
        run: go test -v -count=1 github.com/fabriziosalmi/caddy-waf/...

      - name: caddy-dns/cloudflare
        run: go test -count=1 github.com/caddy-dns/cloudflare/...

      - name: greenpau/caddy-security
        run: go test -count=1 github.com/greenpau/caddy-security/...

      - name: mentimeter/caddy-storage-cf-kv
        run: go test -count=1 github.com/mentimeter/caddy-storage-cf-kv/...

      - name: mholt/caddy-l4
        run: go test -count=1 github.com/mholt/caddy-l4/...

      - name: mholt/caddy-ratelimit
        run: go test -count=1 github.com/mholt/caddy-ratelimit/...

      - name: ueffel/caddy-brotli
        run: go test -count=1 github.com/ueffel/caddy-brotli/...
